# Basic experiment configuration
policy_name: fastwam_policy
task_name: null
task_config: null
ckpt_setting: null
seed: 0
instruction_type: unseen
eval_num_episodes: 100

# fastwam policy args
sim_cfg_path: null
sim_task: null
sim_cfg_name: sim_robotwin.yaml
mixed_precision: bf16
device: cuda
multi_gpu: false
video_device: cuda:1
action_device: cuda:0
dataset_stats_path: null
action_horizon: null
replan_steps: 8
num_inference_steps: 10
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
# null / omit = no Quality suffix; "high" or "low" to match quality-aware training
prompt_quality_suffix: null
# null / omit = no numeric score; 1-5 for quality-score-trained checkpoints
prompt_quality_score: null
rand_device: cpu
tiled: false
timing_enabled: false
skip_get_obs_within_replan: false
save_denoised_video: false
denoised_video_save_root: null
denoised_video_fps: 8
# Gripper post-process: <low -> 0; >high -> 1; mid band subtract mid_delta
binarize_gripper: false
gripper_binarize_low: 0.3
gripper_binarize_high: 0.7
gripper_binarize_mid_delta: 0.05
# DreamZero action-chunk smoothing (full horizon, then execute first replan_steps)
smooth_action_chunk: false
smooth_upsample_factor: 2
smooth_savgol_window: 21
smooth_savgol_polyorder: 3
