# @package _global_
#
# FastWAM QUALITY mixed SFT on robocasa365 (300-task expert + one-or-more rollout
# sources), with per-episode quality-score-weighted ACTION loss.
#
# Data : robocasa365_mixed_quality (generated by
#        scripts/gen_robocasa365_mixed_quality_config.py). Expert dirs get a fixed
#        score; each rollout source gets {success, failure} scores read from
#        meta/episodes.jsonl. Supports multiple rollout sources; a single source
#        also works.
# Model: fastwam_joint_mixed_quality_robocasa (FastWAMJointMixedQualityWeighted).
#        The action loss per sample is scaled by action_loss_quality_weights
#        (score -> weight), which you tune in the MODEL yaml. Expert (score 5)
#        learns action fully; failed rollouts (score 1) contribute video only.
#
# Matches the expert/basic-mixed 65-frame setting so it is a clean upgrade path.
#
# Run:
#   bash train_robocasa365.sh
#   NPROC_PER_NODE=16 bash train_robocasa365.sh

defaults:
  - override /data: robocasa365_mq_3rollout
  - override /model: fastwam_joint_mixed_quality_weighted_custom
  - _self_

# dataloading (match the expert / basic-mixed run)
batch_size: 16
num_workers: 12

model:
  mot_checkpoint_mixed_attn: false
  joint_mixed_training:
    expert_video_beta: [7.0, 1.0]
    weak_action_beta: [1.0, 7.0]
  # NOTE: action_loss_quality_weights lives in the model yaml and is tunable;
  # override it here per-run if you want, e.g.:
  # action_loss_quality_weights:
  #   1: 0.0
  #   4: 0.8
  #   5: 1.0

# scheduler (match robocasa365_join_256x384_1e-4)
lr_scheduler_type: "cosine"
learning_rate: 1e-4

num_epochs: 3
max_steps: 112500
log_every: 5

save_every: 2500
save_total_limit: 4
eval_every: 2500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
