# @package _global_
#
# Joint FastWAM + mixed-quality training with quality-weighted action supervision.
# Run (example):
#   python scripts/train.py task=robotwin_quality_score_3low_1cam_stitched_384_1e-4_action_weighted

defaults:
  - override /data: robotwin_mixed_quality_score_3low_stitched
  - override /model: fastwam_joint_mixed_quality_weighted
  - _self_

batch_size: 16
num_workers: 12

model:
  mot_checkpoint_mixed_attn: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
