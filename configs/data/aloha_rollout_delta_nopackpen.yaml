# Aloha mixed-quality training for aloha_rollout_delta_nopackpen.
# Expert table30 (score 12, action supervised) + rcv2 (per-episode score, weak branch).
# Action is chunk-relative joint on all 14 dims.
# Norm stats match checkpoints/aloha_rollout_delta_nopackpen/dataset_stats.json
# (dataset_stats_relative_joint_no_pack_pencil.json).
# Launch script drops pack_the_items, pack_the_toothbrush_holder, and pencil-case episodes.
# stamp_positioning prompts are switched in scripts/train.py.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./converted_data/table30-rc_aloha_10-lerobot_stitched
    - ./converted_data/rcv2-rc_aloha_10-lerobot_stitched
  dataset_supervise_action:
    - true
    - false
  dataset_prompt_quality_score:
    - 12
    - episode
  shape_meta:
    images:
      - key: robotwin
        raw_shape: [3, 384, 320]
        shape: [3, 384, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 65
  global_sample_stride: 1
  action_video_freq_ratio: 8
  decode_video_sampled_frames_only: true
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ./converted_data/table30-rc_aloha_10-lerobot_stitched/dataset_stats_relative_joint_no_pack_pencil.json
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys:
          - default
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
  text_embedding_cache_dir:
    - ./converted_data/table30-rc_aloha_10-lerobot_stitched/text_embeds_cache_quality_score
    - ./converted_data/rcv2-rc_aloha_10-lerobot_stitched/text_embeds_cache_quality_score
  context_len: 128

val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./converted_data/table30-rc_aloha_10-lerobot_stitched
  dataset_prompt_quality_score:
    - 12
  shape_meta: ${data.train.shape_meta}
  num_frames: 65
  global_sample_stride: 1
  action_video_freq_ratio: 8
  decode_video_sampled_frames_only: true
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: false
  pretrained_norm_stats: ./converted_data/table30-rc_aloha_10-lerobot_stitched/dataset_stats_relative_joint_no_pack_pencil.json
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys:
          - default
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
  text_embedding_cache_dir: ./converted_data/table30-rc_aloha_10-lerobot_stitched/text_embeds_cache_quality_score
  context_len: 128
