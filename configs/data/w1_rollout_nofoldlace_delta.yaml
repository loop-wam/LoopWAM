# W1 training for w1_rollout_nofoldlace_delta.
# Expert prompts in text_embeds_cache have no "Quality:" suffix.
# rcv2 prompts use per-episode scores and text_embeds_cache_quality_score.
# Action is chunk-relative joint on all 14 dims.
# Norm stats match checkpoints/w1_rollout_nofoldlace_delta/dataset_stats.json
# (dataset_stats_relative_joint.json, the full set, not the later abs-gripper file).
# Launch script drops fold_the_clothes and untie_the_shoelaces episodes.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./converted_data/table30-rc_w1_4_6-lerobot_stitched
    - ./converted_data/rcv2-rc_w1_4-lerobot_stitched
    - ./converted_data/rcv2-rc_w1_6-lerobot_stitched
  dataset_supervise_action:
    - true
    - false
    - false
  dataset_prompt_quality_score:
    - null
    - episode
    - episode
  shape_meta:
    images:
      - key: robotwin
        raw_shape: [3, 384, 320]
        shape: [3, 384, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 65
  global_sample_stride: 1
  action_video_freq_ratio: 8
  decode_video_sampled_frames_only: true
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ./converted_data/table30-rc_w1_4_6-lerobot_stitched/dataset_stats_relative_joint.json
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys:
          - default
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
  text_embedding_cache_dir:
    - ./converted_data/table30-rc_w1_4_6-lerobot_stitched/text_embeds_cache
    - ./converted_data/rcv2-rc_w1_4-lerobot_stitched/text_embeds_cache_quality_score
    - ./converted_data/rcv2-rc_w1_6-lerobot_stitched/text_embeds_cache_quality_score
  context_len: 128

val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./converted_data/table30-rc_w1_4_6-lerobot_stitched
  dataset_prompt_quality_score:
    - null
  shape_meta: ${data.train.shape_meta}
  num_frames: 65
  global_sample_stride: 1
  action_video_freq_ratio: 8
  decode_video_sampled_frames_only: true
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: false
  pretrained_norm_stats: ./converted_data/table30-rc_w1_4_6-lerobot_stitched/dataset_stats_relative_joint.json
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys:
          - default
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 320]
  text_embedding_cache_dir: ./converted_data/table30-rc_w1_4_6-lerobot_stitched/text_embeds_cache
  context_len: 128
