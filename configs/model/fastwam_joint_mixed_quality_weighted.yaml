_target_: fastwam.models.wan22.fastwam_joint_mixed_quality_weighted.create_fastwam_joint_mixed_quality_weighted
model_id: Wan2.2-TI2V-5B
tokenizer_model_id: Wan2.2-TI2V-5B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
# Default keeps both branches cross-attending text + proprio. Set false for
# video branch to cross-attend text only while action branch still uses proprio.
video_cross_attend_proprio: true
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Optional: override Beta(a,b) on noise fraction k; timesteps are k * num_train_timesteps.
joint_mixed_training:
  expert_video_beta: [7.0, 1.0]
  weak_action_beta: [1.0, 7.0]

# Quality score is parsed from the batch prompt suffix: "Quality: N."
# The loss is normalized by sum(weights), keeping action loss magnitude comparable.
action_loss_quality_weights:
  1: 0.0
  2: 0.0
  3: 0.3
  4: 0.6
  5: 1.0

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
